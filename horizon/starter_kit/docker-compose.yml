# ---------------------------------------------------------------------------
#  Horizon Bank | Bank Account System capstone | local data layer
#
#  PostgreSQL 16 (system of record) + Redis 7 (cache) + Apache Kafka 4.3.1
#  (events, single KRaft node) + Kafka UI. Your Spring Boot / Node.js /
#  Python application runs on the laptop and connects to the ports below.
#
#      docker compose up -d            # start everything, wait for "healthy"
#      docker compose ps               # check status
#      docker compose logs -f kafka    # follow one service's log
#      docker compose down             # stop, KEEP the data
#      docker compose down -v          # stop and DELETE all data
#                                      # (db/*.sql run again on the next start)
#
#  From your laptop        ->  PostgreSQL localhost:5432   Redis localhost:6379
#                              Kafka      localhost:9092   Kafka UI http://localhost:8085
#  From inside the network ->  bank-postgres:5432  bank-redis:6379  bank-kafka:19092
# ---------------------------------------------------------------------------
name: bank-capstone

services:

  postgres:
    image: postgres:16-alpine
    container_name: bank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: bank_admin            # superuser: DDL, psql labs
      POSTGRES_PASSWORD: bank_admin_pwd    # lab-only password
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro   # 01_schema.sql, 02_seed.sql - FIRST start only
      - ./sql:/sql:ro                         # lab scripts, run with psql -f /sql/...
    healthcheck:
      # 127.0.0.1 (TCP), so the check stays red while the init scripts run
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bank_admin -d bankdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: bank-redis
    restart: unless-stopped
    # pure cache: no persistence, 128 MB cap, evict least-recently-used keys
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    container_name: bank-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # CLI tools on PATH:  docker exec bank-kafka kafka-topics.sh ...
      PATH: "/opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      # --- single node, broker + KRaft controller in one process (lab only)
      CLUSTER_ID: "bnkCapStone-4k3x9QpLwA"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@bank-kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # INTERNAL for containers, EXTERNAL (localhost:9092) for your app
      KAFKA_LISTENERS: "INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://bank-kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # --- one broker, so every replication factor is 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"     # topics are created on purpose
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafkadata:/var/lib/kafka/data
      - ./kafka:/scripts:ro                        # create-topics.sh
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: bank-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bank-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: bank-kafka:19092

volumes:
  pgdata:
  kafkadata:
